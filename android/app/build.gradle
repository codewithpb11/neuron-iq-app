plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('release-signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.codewithpb11.neuroniq'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codewithpb11.neuroniq'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

// Package the existing website exactly as it is, including its local Stockfish worker.
def webAssetsDir = layout.buildDirectory.dir('generated/web-assets')
tasks.register('syncWebAssets', Copy) {
    from('../..') {
        include 'index.html'
        include 'styles.css'
        include 'app.js'
        include 'assets/**'
    }
    into webAssetsDir
}

android.sourceSets.named('main') {
    assets.srcDir(webAssetsDir)
}

tasks.named('preBuild') {
    dependsOn('syncWebAssets')
}
